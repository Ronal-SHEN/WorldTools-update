modLoader = "kotlinforforge"
loaderVersion = "[5,)"
license = "GNU General Public License v3.0"
issueTrackerURL = "https://github.com/Ronal-SHEN/WorldTools-update/issues"

[[accessTransformers]]
file = "META-INF/accesstransformer.cfg"

[[mods]]
modId = "worldtools"
version = "${version}"
displayName = "WorldTools"
displayURL = "https://modrinth.com/mod/worldtools-update"
authors = "Constructor, P529, rfresh2"
description = '''
Download a server's world as a detailed singleplayer world. An updated fork of WorldTools.
'''
logoFile = "assets/worldtools/WorldTools.png"

[[mixins]]
config = "worldtools.mixins.common.json"

[[dependencies.worldtools]]
modId = "neoforge"
type = "required"
versionRange = "[26.2,)"
ordering = "NONE"
side = "CLIENT"

[[dependencies.worldtools]]
modId = "minecraft"
type = "required"
versionRange = "[26.2,)"
ordering = "NONE"
side = "CLIENT"

[[dependencies.worldtools]]
modId = "kotlinforforge"
type = "required"
versionRange = "[5,)"
ordering = "AFTER"
side = "CLIENT"

[[dependencies.worldtools]]
modId = "cloth_config"
type = "required"
versionRange = "[18,)"
ordering = "AFTER"
side = "CLIENT"
